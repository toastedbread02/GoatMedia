name: Deploy website

# Builds the React site and publishes it to GitHub Pages. The API it talks to is
# deployed separately (see DEPLOY.md); set the repository variable API_ORIGIN to
# that server's public URL before this runs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Publishing without an API URL would ship a site that cannot sign in or
    # load a feed, so this job stays skipped until the variable is set.
    if: ${{ vars.API_ORIGIN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build the site against the API
        env:
          VITE_API_ORIGIN: ${{ vars.API_ORIGIN }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          # A repo project site lives under /<repo>/; a custom domain serves from
          # the root. Set the CUSTOM_DOMAIN variable once you own the name.
          VITE_BASE_PATH: ${{ vars.CUSTOM_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
        run: |
          if [ -z "$VITE_API_ORIGIN" ]; then
            echo "::error::Set the repository variable API_ORIGIN (Settings -> Secrets and variables -> Actions -> Variables) to the public URL of the GoatMedia server, for example https://goatmedia.example.com"
            exit 1
          fi
          npm run build
          # Pages serves 404.html for unknown paths; reusing the app shell lets
          # deep links like /GoatMedia/v/<id> boot the router instead of 404ing.
          cp dist/index.html dist/404.html
          # The CNAME file is what tells Pages which domain to answer on. It is
          # only written when the variable is set, so the current address keeps
          # working until the new one resolves.
          if [ -n "$CUSTOM_DOMAIN" ]; then
            printf '%s\n' "$CUSTOM_DOMAIN" > dist/CNAME
            echo "Building for https://$CUSTOM_DOMAIN"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
