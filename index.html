<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F0E6" />
    <meta name="description" content="GoatMedia is a video community for goats — uploaded by people, reviewed by a human, watched by everyone." />
    <title>GoatMedia</title>
    <link rel="canonical" href="https://toastedbread02.github.io/GoatMedia/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GoatMedia" />
    <meta property="og:title" content="GoatMedia — only goats" />
    <meta
      property="og:description"
      content="A video community for goats. Every post is watched by a person before it goes live."
    />
    <meta property="og:url" content="https://toastedbread02.github.io/GoatMedia/" />
    <meta property="og:image" content="https://toastedbread02.github.io/GoatMedia/og.png" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GoatMedia — only goats" />
    <meta
      name="twitter:description"
      content="A video community for goats. Every post is watched by a person before it goes live."
    />
    <meta name="twitter:image" content="https://toastedbread02.github.io/GoatMedia/og.png" />
    <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Resolve the saved appearance before the first paint so a dark-theme
      // reader never gets a flash of paper-white.
      (function () {
        try {
          var choice = localStorage.getItem('gm-theme') || 'system';
          var dark =
            choice === 'dark' ||
            (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          if (localStorage.getItem('gm-motion') === 'reduced') {
            document.documentElement.dataset.motion = 'reduced';
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
