<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../public/fonts/bricolage-latin.woff2') format('woff2');
        font-weight: 400 800;
        font-display: block;
      }
      @font-face {
        font-family: 'Instrument Sans';
        src: url('../public/fonts/instrument-sans-latin.woff2') format('woff2');
        font-weight: 400 700;
        font-display: block;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1400px;
        height: 830px;
        overflow: hidden;
      }
      body {
        background: #f5f0e5;
        display: grid;
        place-items: center;
      }
      .card {
        width: 1200px;
        height: 630px;
        color: #1c1915;
        font-family: 'Instrument Sans', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 76px 80px 68px;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .wordmark {
        font-family: 'Bricolage', system-ui, sans-serif;
        font-size: 84px;
        font-weight: 700;
        letter-spacing: -0.005em;
        line-height: 1;
      }
      .tagline {
        font-size: 34px;
        line-height: 1.35;
        color: #57503f;
        max-width: 22ch;
        margin-top: 34px;
      }
      .url {
        font-size: 22px;
        color: #6f6759;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
      <div class="mark">
        <svg viewBox="0 0 32 32" width="76" height="76" aria-hidden="true">
          <path d="M10.6 12.4 22.6 17l-12 4.6z" fill="#b24e22" />
          <path
            d="M11.4 10.9C10.2 8.4 8.2 7.2 5.9 7.5c1.4 1.7 2.2 3.7 2.4 5.6M19.9 10.6c.9-2.4 2.8-3.6 5.1-3.3.1 1.9-1.6 3.6-2.2 5.4"
            fill="none"
            stroke="#1c1915"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <span class="wordmark">GoatMedia</span>
      </div>
        <p class="tagline">Only goats. Every post watched by a person before it goes live</p>
      </div>
      <p class="url">toastedbread02.github.io/GoatMedia</p>
    </div>
  </body>
</html>
